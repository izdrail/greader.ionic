<ion-header><ion-toolbar color="primary"><ion-title>Connect a reader</ion-title></ion-toolbar></ion-header>
<ion-content><section class="intro"><img src="assets/logo/logo.png" alt="gReader News"><h1>Welcome to gReader News</h1><p>Choose a service or start with private, local RSS.</p></section>
<div class="providers"><ion-card *ngFor="let provider of providers"><ion-card-header><img [src]="'assets/greader/' + provider.logo" alt=""><ion-card-title>{{ provider.name }}</ion-card-title></ion-card-header><ion-card-content><p>{{ provider.text }}</p><ion-button expand="block" [disabled]="busy()" (click)="connect(provider.id)">{{ provider.id === 'local' ? 'Start local reader' : 'Connect' }}</ion-button></ion-card-content></ion-card></div>
<section class="provider-form" *ngIf="selected() as provider"><h2>{{ provider === 'feedly' ? 'Feedly OAuth' : 'Provider login' }}</h2><ion-list *ngIf="provider !== 'feedly'"><ion-item><ion-input label="Email or username" labelPlacement="stacked" [(ngModel)]="username"></ion-input></ion-item><ion-item><ion-input label="Password" labelPlacement="stacked" type="password" [(ngModel)]="password"></ion-input></ion-item></ion-list><ion-note color="warning">{{ error() }}</ion-note></section>
</ion-content>
