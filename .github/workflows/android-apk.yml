name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    # Always GitHub-hosted: ubuntu-latest images ship the Android SDK,
    # build-tools and cmdline-tools preinstalled.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # AdMob ships only when the repo variable ENABLE_ADMOB is set to 'true'
      # (Settings -> Secrets and variables -> Actions -> Variables). Default:
      # ads are stripped from the final app - no SDK, no manifest entry, no ad code.
      - name: Strip AdMob (ENABLE_ADMOB is not true)
        if: ${{ vars.ENABLE_ADMOB != 'true' }}
        run: |
          npm rm @capacitor-community/admob
          node scripts/strip-admob.mjs

      - run: npm run build
      - run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: greader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
